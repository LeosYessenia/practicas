<!DOCTYPE html> <!-- Tipo de documento html -->
<html lang="en"> <!-- Define que el idioma es inglés -->
<head> <!-- Informacion que no se ve directamente -->
<meta charset="UTF-8"> <!-- Permite mostrar caracteres especiales, letras 'ñ' y acentos -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta el tamaño de la página al ancho de pantallas móviles -->
<title>Formularios en HTML</title> <!-- Título que aparece en la pestaña del navegador -->
<!-- Enlace externo para cargar los íconos de la librería Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head> <!-- Cierre del head -->
<body> <!-- Cuerpo -->

<h2>Formularios con seleccion</h2> <!-- Título -->

<form action="" method="post"> <!-- Inicio del formulario -->

Ingresa tu nombre: <!-- Texto que le dice al usuario que ingrese su nombre -->
<input type="text" name="nombre"> <!-- Campo para el nombre -->

<br> <!-- Salto de línea -->

Selecciona tu pais: <!-- Instrucción para la lista de selección -->
<select name="pais"> <!-- Crea una lista desplegable de opciones -->
<option value="1">Argentina</option> <!-- Opción seleccionable con el valor '1' -->
<option value="2">España</option> <!-- Opción seleccionable con el valor '2' -->
<option value="3">Mexico</option> <!-- Opción seleccionable con el valor '3' -->
<option value="4">Guatemala</option> <!-- Opción seleccionable con el valor '4' -->
<option value="5">Honduras</option> <!-- Opción seleccionable con el valor '5' -->
<option value="6">El Salvador</option> <!-- Opción seleccionable con el valor '6' -->
<option value="7">Venezuela</option> <!-- Opción seleccionable con el valor '7' -->
<option value="8">Colombia</option> <!-- Opción seleccionable con el valor '8' -->
</select> <!-- Cierre de la lista desplegable -->

<br> <!-- Salto de línea -->

<input type="submit" value="enviar"> <!-- Botón de envío del formulario -->
<input type="reset" value="borrar"> <!-- Botón para borrar los datos del formulario -->

</form> <!-- Cierre del formulario -->

</body> <!-- Cierre del cuerpo -->
</html> <!-- Cierre del documento HTML -->
