<!DOCTYPE html> <!-- Tipo de documento html -->
<html lang="en"> <!-- Define que el idioma es inglés -->
<head> <!-- Contiene información técnica y configuraciones del sitio que no se ven directamente -->
<meta charset="UTF-8"> <!-- Permite mostrar caracteres especiales, letras 'ñ' y acentos correctamente -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la pantalla para dispositivos móviles -->
<title>Formularios en HTML</title> <!-- Título que aparece en la pestaña del navegador -->
<!-- Carga la librería externa de Font Awesome para usar íconos en la página -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head> <!-- Cierre -->
<body> <!-- Cuerpo -->

<h2>Formulario con text area</h2> <!-- Título -->

<form action="" method="post"> <!-- Inicio del formulario (indica cómo y a dónde se enviarían los datos) -->

Ingresa tu nombre: <!-- Texto para pedir el nombre -->
<input type="text" name="nombre"> <!-- Campo para que el usuario ingrese su nombre -->
<br> <!-- Salto de línea -->

Ingresa tu correo: <!-- Texto que pide el correo -->
<input type="email" name="correo"> <!-- Campo de texto optimizado para correos -->
<br> <!-- Salto de línea -->

Ingresa tus comentarios: <!-- Texto descriptivo para los comentarios -->
<textarea name="comentarios" rows="1" cols="10"></textarea> <!-- Area de texto de varias lineas -->
<br> <!-- Salto de línea -->

<input type="submit" value="enviar"> <!-- Botón para enviar la información del formulario -->
<input type="reset" value="borrar"> <!-- Botón para limpiar todos los campos del formulario -->

</form> <!-- Cierre del formulario -->

</body> <!-- Cierre del cuerpo -->
</html> <!-- Cierre del documento HTML -->
