<!DOCTYPE html> <!-- Tipo de documento HTML -->
<html lang="en"> <!-- Define que el idioma es ingles -->
<head> <!-- Información de configuración que no se ve directamente en la página -->
<meta charset="UTF-8"> <!-- para mostrar acentos y caracteres especiales -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta el diseño de la página para que se adapte a dispositivos móviles -->
<title>Formularios en HTML</title> <!-- Define el título que aparece en la pestaña del navegador -->
<!-- Librería externa de Font Awesome para usar íconos en el sitio -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head> <!-- Cierre -->
<body> <!-- Cuerpo del documento -->

<h2>Ejemplo basico</h2> <!-- Título de segundo nivel -->

<form action="" method="post"> <!-- Formulario, "action" define a dónde enviar los datos y "method" cómo enviarlos -->
Ingresa tu nombre:
<input type="text" name="nombre" size="20"> <!-- Campo de texto para que el usuario escriba su nombre (de 20 caracteres) -->
<br> <!-- Salto de línea -->
<input type="submit" value="enviar"> <!-- Botón de envío del formulario -->
</form> <!-- Cierre del del formulario -->

</body> <!-- Cierre del cuerpo -->
</html> <!-- Cierre del documento HTML -->
